[package]
name = "orhunca"
version = "0.10.0"
edition = "2021"
license = "MIT"
description = "Orhunca: Türkçe tabanlı programlama dili ve derleyicisi"
repository = "https://github.com/furkan003/orhunca"

[[bin]]
name = "orhunca"
path = "src/main.rs"

[dependencies]
cranelift-codegen = { version = "0.136", features = ["x86", "arm64"] }
cranelift-frontend = "0.136"
cranelift-module = "0.136"
cranelift-object = "0.136"
cranelift-native = "0.136"
target-lexicon = "0.13"
serde_json = "1"
wasm-encoder = "0.261"
# Android APK imzası (ECDSA P-256)
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
object = { version = "0.40", default-features = false, features = ["read_core", "elf", "coff", "std"] }

# İşletim sisteminin güvenli rastgele sayı üreteci; WebAssembly (tarayıcıda deneme) hedefinde yok.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"

[dev-dependencies]
wasmparser = "0.261"

[profile.release]
opt-level = 3
