<script>
(function () {
  'use strict';
  var CALISMA_ZAMANI = '__CALISMA_ZAMANI__';
  var PROGRAM = '__PROGRAM__';
  var konsol = document.getElementById('konsol');
  document.getElementById('kapat').addEventListener('click', function () { konsol.hidden = true; });

  function baytlar(b64) {
    var s = atob(b64);
    var b = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }

  // Programın ekrana yazdıkları ve çalışma hataları küçük bir konsolda görünür.
  function yaz(metin, hata) {
    var s = document.createElement('span');
    if (hata) s.className = 'hata';
    s.textContent = metin;
    konsol.appendChild(s);
    konsol.hidden = false;
    konsol.scrollTop = konsol.scrollHeight;
  }

  var cozuculer = { 1: new TextDecoder(), 2: new TextDecoder() };
  Orhunca.baslat({
    calismaZamani: baytlar(CALISMA_ZAMANI),
    program: baytlar(PROGRAM),
    arayuzKoku: document.getElementById('uygulama'),
    cikti: function (akis, b) {
      yaz(cozuculer[akis].decode(b, { stream: true }), akis === 2);
    },
    satirOku: function () { return window.prompt('Girdi:'); },
    dosyalar: Orhunca.tarayiciDosyalari('orhunca:' + document.title + ':'),
    ortam: {},
    argumanlar: [],
  }).catch(function (h) { yaz('Çalışma hatası: ' + h + '\n', true); });
})();
</script>
