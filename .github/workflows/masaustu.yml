name: Masaüstü
# Orhunca Stüdyo masaüstü uygulamasının kurulum dosyaları (Tauri):
# Linux .deb/.AppImage/.rpm, Windows .msi/kurulum .exe, macOS .dmg (deneysel).
on:
  push:
    # Dallarda yalnızca masaüstünü etkileyen değişikliklerde; sürüm etiketlerinde her zaman.
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "masaustu/**"
      - "studio/**"
      - "src/studyo/**"
      - ".github/workflows/masaustu.yml"
  workflow_dispatch:
jobs:
  studyo:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kurulum dosyalarını oluştur
        working-directory: masaustu
        run: npx --yes @tauri-apps/cli@^2 build
      - uses: actions/upload-artifact@v4
        with:
          name: orhunca-studyo-${{ runner.os }}
          if-no-files-found: error
          path: |
            masaustu/target/release/bundle/deb/*.deb
            masaustu/target/release/bundle/appimage/*.AppImage
            masaustu/target/release/bundle/rpm/*.rpm
            masaustu/target/release/bundle/msi/*.msi
            masaustu/target/release/bundle/nsis/*.exe
            masaustu/target/release/bundle/dmg/*.dmg
