name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Windows .exe çapraz derleme (C derleyicisi olmadan)
        run: |
          cargo run -- derle örnekler/asal.ohc --hedef windows -o asal.exe
          file asal.exe
      - name: Biçim denetimi (Orhunca örnekleri)
        run: cargo run -- biçimlendir --denetle örnekler öz runtime/ön_kütüphane.ohc
  wasm:
    # Çalışma zamanını kaynaktan WebAssembly'ye derler ve WebAssembly testlerini onunla çalıştırır
    # (depodaki runtime/wasm/orhunca_rt.wasm'ın kaynakla tutarlı olduğunu da gösterir).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Çalışma zamanını WebAssembly'ye derle
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          araclar/wasm_calisma_zamani.sh
      - run: cargo test --test wasm --test oz
      - run: cargo test --lib wasm_uretici
  calistirici:
    # Hazır çalıştırıcıları kaynaktan yeniden derler ve örnekleri onlarla çalıştırır
    # (depodaki runtime/calistirici/ dosyalarının kaynakla tutarlı olduğunu da gösterir).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Çalıştırıcıları derle
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
          araclar/calistiricilar.sh
      - run: cargo test --test ornekler --test web_sunucu --test web
  windows:
    # Windows'ta C derleyicisi ya da bağlayıcı olmadan: örnekler gömülü çalıştırıcıyla
    # derlenir, çalıştırılır ve çıktıları beklenenle karşılaştırılır.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: Örnekler (hazır çalıştırıcı)
        shell: bash
        run: |
          hata=0
          for f in örnekler/*.ohc; do
            b="${f%.ohc}.beklenen"
            d=$(mktemp -d)
            if ! (cd "$d" && "$GITHUB_WORKSPACE/target/debug/orhunca.exe" çalıştır "$GITHUB_WORKSPACE/$f" > çıktı.txt); then
              echo "ÇALIŞMADI: $f"; hata=1; continue
            fi
            tr -d '\r' < "$d/çıktı.txt" > "$d/düz.txt"
            tr -d '\r' < "$b" > "$d/beklenen.txt"
            if ! diff -q "$d/düz.txt" "$d/beklenen.txt" > /dev/null; then
              echo "FARK: $f"; diff "$d/düz.txt" "$d/beklenen.txt" | head -20 || true; hata=1
            fi
          done
          exit $hata
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: VS Code eklentisini paketle
        working-directory: editors/vscode
        run: |
          npm ci
          npx --yes @vscode/vsce package
