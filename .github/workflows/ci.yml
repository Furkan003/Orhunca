name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Pencere sınaması için WebKitGTK ve sanal ekran
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
      - run: cargo test
      - name: Windows .exe çapraz derleme (C derleyicisi olmadan)
        run: |
          cargo run -- derle örnekler/asal.ohc --hedef windows -o asal.exe
          file asal.exe
      - name: Biçim denetimi (Orhunca örnekleri)
        run: cargo run -- biçimlendir --denetle örnekler öz runtime/ön_kütüphane.ohc
      - name: Stüdyo ders verisi güncel (dersler/*.md → studio/dersler.json)
        run: python3 araclar/dersler.py --studyo && git diff --exit-code studio/dersler.json
  wasm:
    # Çalışma zamanını kaynaktan WebAssembly'ye derler ve WebAssembly testlerini onunla çalıştırır
    # (depodaki runtime/wasm/orhunca_rt.wasm'ın kaynakla tutarlı olduğunu da gösterir).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Çalışma zamanını WebAssembly'ye derle
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          araclar/wasm_calisma_zamani.sh
      - run: cargo test --test wasm --test oz
      - run: cargo test --lib wasm_uretici
  calistirici:
    # Hazır çalıştırıcıları kaynaktan yeniden derler ve örnekleri onlarla çalıştırır
    # (depodaki runtime/calistirici/ dosyalarının kaynakla tutarlı olduğunu da gösterir).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Çalıştırıcıları derle
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
          pip install ziglang
          araclar/calistiricilar.sh
      - run: cargo test --test ornekler --test web_sunucu --test web
      - name: Derlenen programlar eski Linux'larda da çalışır (glibc ≤ 2.17)
        run: |
          cargo run -q -- derle örnekler/asal.ohc -o asal
          surum=$(objdump -T asal | grep -oE "GLIBC_[0-9.]+" | sort -uV | tail -1)
          echo "en yeni glibc sürümü: $surum"
          [ "$(printf '%s\nGLIBC_2.17\n' "$surum" | sort -V | tail -1)" = GLIBC_2.17 ]
  windows:
    # Windows'ta C derleyicisi ya da bağlayıcı olmadan: örnekler gömülü çalıştırıcıyla
    # derlenir, çalıştırılır ve çıktıları beklenenle karşılaştırılır.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: Örnekler (hazır çalıştırıcı)
        shell: bash
        run: |
          hata=0
          for f in örnekler/*.ohc; do
            b="${f%.ohc}.beklenen"
            d=$(mktemp -d)
            if ! (cd "$d" && "$GITHUB_WORKSPACE/target/debug/orhunca.exe" çalıştır "$GITHUB_WORKSPACE/$f" > çıktı.txt); then
              echo "ÇALIŞMADI: $f"; hata=1; continue
            fi
            tr -d '\r' < "$d/çıktı.txt" > "$d/düz.txt"
            tr -d '\r' < "$b" > "$d/beklenen.txt"
            if ! diff -q "$d/düz.txt" "$d/beklenen.txt" > /dev/null; then
              echo "FARK: $f"; diff "$d/düz.txt" "$d/beklenen.txt" | head -20 || true; hata=1
            fi
          done
          exit $hata
      - name: Masaüstü uygulaması (orhunca paketle, gerçek pencere)
        shell: bash
        run: |
          target/debug/orhunca.exe paketle örnekler/arayüz/sayaç.ohc -o sayac.exe
          ORHUNCA_KABUK_SINAMA=1 timeout 120 ./sayac.exe > pencere.txt
          cat pencere.txt
          grep -q "Şu anki değer: 0" pencere.txt
      - name: Hata ayıklayıcı (çalışma zamanı, Windows soketleri)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: python araclar/ayiklama_sinamasi.py target/debug/orhunca.exe "$RUNNER_TEMP/ayiklama"
  kabuk:
    # Hazır pencere kabuklarını (orhunca paketle) kaynaktan derler, gerçek bir
    # pencerede açıp sayfanın yüklendiğini sınar ve çıktıları yükler.
    # Linux kabuğu geniş uyumluluk için eski glibc'li sistemde derlenir.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            kabuk: masaustu/kabuk/target/release/orhunca-kabuk
            ad: linux-x86_64
          - os: windows-latest
            kabuk: masaustu/kabuk/target/release/orhunca-kabuk.exe
            ad: windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb
      - name: Kabuğu derle
        working-directory: masaustu/kabuk
        run: cargo test --release && cargo build --release
      - name: Gerçek pencerede sına
        shell: bash
        run: |
          python3 - "${{ matrix.kabuk }}" <<'PY'
          import struct, sys
          sayfa = b"<html><body><h1>Merhaba kabuk</h1><script>document.body.append(' depo:' + typeof window.orhuncaKabukDepo)</script></body></html>"
          baslik = "Sınama".encode()
          yuk = b"OHCKABUK" + struct.pack("<I", len(baslik)) + baslik + sayfa
          veri = open(sys.argv[1], "rb").read() + yuk + b"ORHUNCA!" + struct.pack("<Q", len(yuk))
          open("sinama" + (".exe" if sys.argv[1].endswith(".exe") else ""), "wb").write(veri)
          PY
          if [ "$RUNNER_OS" = Linux ]; then
            chmod +x sinama
            ORHUNCA_KABUK_SINAMA=1 timeout 120 xvfb-run -a ./sinama > cikti.txt
          else
            ORHUNCA_KABUK_SINAMA=1 timeout 120 ./sinama.exe > cikti.txt
          fi
          cat cikti.txt
          grep -q "Merhaba kabuk" cikti.txt
          grep -q "depo:object" cikti.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kabuk-${{ matrix.ad }}
          path: ${{ matrix.kabuk }}
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: VS Code eklentisini paketle
        working-directory: editors/vscode
        run: |
          npm ci
          npx --yes @vscode/vsce package
