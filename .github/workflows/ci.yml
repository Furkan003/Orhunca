name: CI
# Actions dakikalarını korumak için: her push'ta yalnızca Linux işleri çalışır
# (Windows dakikası 2 kat sayılır). Windows işleri çekme isteklerinde, sürüm
# etiketlerinde ve elle (Actions → CI → Run workflow) çalışır. Yalnızca belge
# değişikliklerinde CI çalışmaz.
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:
concurrency:
  # Elle başlatılan çalışmalar (Android/iOS işleri dahil) yeni gönderimlerle iptal olmasın
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Pencere sınaması için WebKitGTK ve sanal ekran
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
      - run: cargo test
      - name: Windows .exe çapraz derleme (C derleyicisi olmadan)
        run: |
          cargo run -- derle örnekler/asal.ohc --hedef windows -o asal.exe
          file asal.exe
      - name: Biçim denetimi (Orhunca örnekleri)
        run: cargo run -- biçimlendir --denetle örnekler öz runtime/ön_kütüphane.ohc
      - name: Stüdyo ders verisi güncel (dersler/*.md → studio/dersler.json)
        run: python3 araclar/dersler.py --studyo && git diff --exit-code studio/dersler.json
  arm:
    # 64 bit ARM Linux (Raspberry Pi 4/5, ARM dizüstüler): hazır çalıştırıcı yok, programlar
    # sistemdeki C derleyicisiyle bağlanır. Örnekler derlenip çıktıları denetlenir.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: Örnekler (ARM, sistem C derleyicisi)
        shell: bash
        run: |
          d=$(mktemp -d); hata=0
          for f in örnekler/*.ohc; do
            ad=$(basename "$f" .ohc)
            [ -f "örnekler/$ad.beklenen" ] || continue
            if ! target/debug/orhunca çalıştır "$f" < /dev/null > "$d/$ad.cikti" 2>&1 || ! diff -q <(tr -d '\r' < "örnekler/$ad.beklenen") "$d/$ad.cikti" >/dev/null; then
              echo "✗ $ad"; diff <(tr -d '\r' < "örnekler/$ad.beklenen") "$d/$ad.cikti" | head -20; hata=1
            else
              echo "✓ $ad"
            fi
          done
          exit $hata
      - run: cargo test --test ornekler --test hata_mesajlari --test dersler --test bulanik --test guncelleme --lib
  wasm:
    # Çalışma zamanını kaynaktan WebAssembly'ye derler ve WebAssembly testlerini onunla çalıştırır
    # (depodaki runtime/wasm/orhunca_rt.wasm'ın kaynakla tutarlı olduğunu da gösterir).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Çalışma zamanını WebAssembly'ye derle
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          araclar/wasm_calisma_zamani.sh
      - run: cargo test --test wasm --test oz
      - run: cargo test --lib wasm_uretici
  calistirici:
    # Hazır çalıştırıcıları kaynaktan yeniden derler ve örnekleri onlarla çalıştırır
    # (depodaki runtime/calistirici/ dosyalarının kaynakla tutarlı olduğunu da gösterir).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Çalıştırıcıları derle
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
          pip install ziglang
          araclar/calistiricilar.sh
      - run: cargo test --test ornekler --test web_sunucu --test web
      - name: Derlenen programlar eski Linux'larda da çalışır (glibc ≤ 2.17)
        run: |
          cargo run -q -- derle örnekler/asal.ohc -o asal
          surum=$(objdump -T asal | grep -oE "GLIBC_[0-9.]+" | sort -uV | tail -1)
          echo "en yeni glibc sürümü: $surum"
          [ "$(printf '%s\nGLIBC_2.17\n' "$surum" | sort -V | tail -1)" = GLIBC_2.17 ]
  windows:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    # Windows'ta C derleyicisi ya da bağlayıcı olmadan: örnekler gömülü çalıştırıcıyla
    # derlenir, çalıştırılır ve çıktıları beklenenle karşılaştırılır.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - name: Örnekler (hazır çalıştırıcı)
        shell: bash
        run: |
          hata=0
          for f in örnekler/*.ohc; do
            b="${f%.ohc}.beklenen"
            d=$(mktemp -d)
            if ! (cd "$d" && "$GITHUB_WORKSPACE/target/debug/orhunca.exe" çalıştır "$GITHUB_WORKSPACE/$f" > çıktı.txt); then
              echo "ÇALIŞMADI: $f"; hata=1; continue
            fi
            tr -d '\r' < "$d/çıktı.txt" > "$d/düz.txt"
            tr -d '\r' < "$b" > "$d/beklenen.txt"
            if ! diff -q "$d/düz.txt" "$d/beklenen.txt" > /dev/null; then
              echo "FARK: $f"; diff "$d/düz.txt" "$d/beklenen.txt" | head -20 || true; hata=1
            fi
          done
          exit $hata
      - name: Masaüstü uygulaması (orhunca paketle, gerçek pencere)
        shell: bash
        run: |
          target/debug/orhunca.exe paketle örnekler/arayüz/sayaç.ohc -o sayac.exe
          ORHUNCA_KABUK_SINAMA=1 timeout 120 ./sayac.exe > pencere.txt
          cat pencere.txt
          grep -q "Şu anki değer: 0" pencere.txt
      - name: Sunucuya yayın klasörü (Windows'ta Linux programı derlenir)
        shell: bash
        run: |
          d=$(mktemp -d) && cd "$d"
          "$GITHUB_WORKSPACE/target/debug/orhunca.exe" yeni site --şablon tam_yigin
          cd site && "$GITHUB_WORKSPACE/target/debug/orhunca.exe" yayınla --alan ornek.com
          [ "$(head -c 4 cikti/yayın/site | tail -c 3)" = ELF ]
          grep -q "reverse_proxy" cikti/yayın/kur.sh
      - name: Hata ayıklayıcı (çalışma zamanı, Windows soketleri)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: python araclar/ayiklama_sinamasi.py target/debug/orhunca.exe "$RUNNER_TEMP/ayiklama"
      - name: Veritabanları (Windows'ta SQLite; varsa SQL Server LocalDB, Windows kimlik doğrulaması)
        shell: bash
        run: |
          if command -v sqllocaldb > /dev/null 2>&1; then
            sqllocaldb start MSSQLLocalDB
            # Git Bash ortam değişkenindeki \ işaretini / yapar; adreste %5C olarak yazılır.
            export ORHUNCA_DENEME_SQLSERVER='sqlserver://(localdb)%5CMSSQLLocalDB/orhunca_sinama'
          else
            echo "LocalDB yok; yalnızca SQLite sınanıyor"
          fi
          cargo test --test ornekler sunucu_veritabanlari
  veritabani:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    # Modeller ve sql_sorgu gerçek sunucularla: PostgreSQL, MariaDB (MySQL protokolü) ve
    # SQL Server 2022 (ODBC Driver 18). Her biri SQLite ile aynı çıktıyı vermeli.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orhunca
          POSTGRES_PASSWORD: gizli
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: gizli
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect" --health-interval 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Orhunca_Gizli1
          MSSQL_PID: Express
        ports: ["1433:1433"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: İstemci kütüphaneleri (libpq, libmariadb, unixODBC, ODBC Driver 18)
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y libpq5 libmariadb3 unixodbc msodbcsql18
      - run: cargo build --tests
      - name: SQL Server'ın açılmasını bekle
        run: for i in $(seq 60); do (echo > /dev/tcp/127.0.0.1/1433) 2> /dev/null && break; sleep 2; done; sleep 10
      - run: cargo test --test ornekler sunucu_veritabanlari
        env:
          ORHUNCA_DENEME_POSTGRESQL: postgresql://orhunca:gizli@localhost/orhunca_sinama
          ORHUNCA_DENEME_MYSQL: mysql://root:gizli@127.0.0.1/orhunca_sinama
          ORHUNCA_DENEME_SQLSERVER: sqlserver://sa:Orhunca_Gizli1@localhost/orhunca_sinama
  kabuk:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    # Hazır pencere kabuklarını (orhunca paketle) kaynaktan derler, gerçek bir
    # pencerede açıp sayfanın yüklendiğini sınar ve çıktıları yükler.
    # Linux kabuğu geniş uyumluluk için eski glibc'li sistemde derlenir.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            kabuk: masaustu/kabuk/target/release/orhunca-kabuk
            ad: linux-x86_64
          - os: windows-latest
            kabuk: masaustu/kabuk/target/release/orhunca-kabuk.exe
            ad: windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb
      - name: Kabuğu derle
        working-directory: masaustu/kabuk
        run: cargo test --release && cargo build --release
      - name: Gerçek pencerede sına
        shell: bash
        run: |
          python3 - "${{ matrix.kabuk }}" <<'PY'
          import struct, sys
          sayfa = b"<html><body><h1>Merhaba kabuk</h1><script>document.body.append(' depo:' + typeof window.orhuncaKabukDepo)</script></body></html>"
          baslik = "Sınama".encode()
          yuk = b"OHCKABUK" + struct.pack("<I", len(baslik)) + baslik + sayfa
          veri = open(sys.argv[1], "rb").read() + yuk + b"ORHUNCA!" + struct.pack("<Q", len(yuk))
          open("sinama" + (".exe" if sys.argv[1].endswith(".exe") else ""), "wb").write(veri)
          PY
          if [ "$RUNNER_OS" = Linux ]; then
            chmod +x sinama
            ORHUNCA_KABUK_SINAMA=1 timeout 120 xvfb-run -a ./sinama > cikti.txt
          else
            ORHUNCA_KABUK_SINAMA=1 timeout 120 ./sinama.exe > cikti.txt
          fi
          cat cikti.txt
          grep -q "Merhaba kabuk" cikti.txt
          grep -q "depo:object" cikti.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kabuk-${{ matrix.ad }}
          path: ${{ matrix.kabuk }}
  android:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    # Android kabuğunu kaynaktan derler, bir arayüz programını .apk'ya paketler ve
    # gerçek bir Android emülatöründe açıp düğmesine dokunarak sınar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Android kabuğunu derle
        run: araclar/android_kabuk.sh
      - name: Paketle
        run: |
          cargo build
          ORHUNCA_ANDROID_ANAHTARI=$RUNNER_TEMP/anahtar target/debug/orhunca paketle örnekler/arayüz/sayaç.ohc --hedef android -o sayac.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --verbose sayac.apk | head -3
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emülatörde sına
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: araclar/android_sinamasi.sh sayac.apk org.orhunca.sayac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: |
            sayac.apk
            android-ekran.png
  ios:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    # iOS: üretilen Xcode projesi simülatör ve cihaz (imzasız .ipa) için derlenir,
    # simülatörde açılıp ekran görüntüsü alınır.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Xcode projesini üret
        run: |
          cargo build
          target/debug/orhunca paketle örnekler/arayüz/sayaç.ohc --hedef ios -o sayac-ios
      - name: Simülatör için derle ve aç
        working-directory: sayac-ios
        run: |
          xcodebuild -project Uygulama.xcodeproj -target Uygulama -configuration Debug -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO build | tail -5
          cihaz=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(c['udid'] for k,v in d.items() if 'iOS' in k for c in v if 'iPhone' in c['name']))")
          xcrun simctl boot "$cihaz"
          xcrun simctl bootstatus "$cihaz" -b
          xcrun simctl install "$cihaz" build/Debug-iphonesimulator/Uygulama.app
          xcrun simctl launch "$cihaz" org.orhunca.sayac
          sleep 15
          xcrun simctl io "$cihaz" screenshot ../ios-ekran.png
          # Uygulama çökmeden çalışıyor olmalı
          xcrun simctl spawn "$cihaz" launchctl list | grep -q org.orhunca.sayac
      - name: Cihaz için derle (imzasız .ipa)
        working-directory: sayac-ios
        run: |
          xcodebuild -project Uygulama.xcodeproj -target Uygulama -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -5
          mkdir -p Payload && cp -R build/Release-iphoneos/Uygulama.app Payload/ && zip -qr ../Sayac.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: |
            ios-ekran.png
            Sayac.ipa
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: VS Code eklentisini paketle
        working-directory: editors/vscode
        run: |
          npm ci
          npx --yes @vscode/vsce package
