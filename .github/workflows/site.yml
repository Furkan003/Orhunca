name: Site
# Web sitesi (GitHub Pages): tanıtım ve indirme sayfası, tarayıcıda deneme, dersler.
# Her dalda derlenip sınanır; varsayılan dalda yayımlanır.
# İlk kez: Settings → Pages → Source: "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Araçlar
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Siteyi derle
        run: araclar/site.sh _site
      - name: Deneme sayfasının derleyicisini sına (bütün örnekler)
        run: node araclar/site_sinamasi.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  yayinla:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v4
