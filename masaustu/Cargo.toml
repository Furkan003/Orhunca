[package]
name = "orhunca-studyo"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "Orhunca Stüdyo: Türkçe programlama dili Orhunca için masaüstü geliştirme ortamı"
repository = "https://github.com/furkan003/orhunca"
publish = false

# Ana derleyici çalışma alanının parçası değildir: Tauri'nin sistem bağımlılıkları
# (WebKitGTK, WebView2) yalnızca masaüstü uygulaması derlenirken gerekir.
[workspace]

[dependencies]
orhunca = { path = ".." }
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# `cargo tauri build` üretim derlemesinde bunu açar.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
